name: 🐞 Bug
description: Reportar um erro
title: "[BUG] "
labels:
  - bug

body:

  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: Explique o problema.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Resultado atual
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stacktrace

  - type: input
    id: endpoint
    attributes:
      label: Endpoint afetado

  - type: dropdown
    id: severity
    attributes:
      label: Severidade
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Ambiente
      options:
        - Local
        - Development
        - Staging
        - Production
